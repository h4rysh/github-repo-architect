<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="accentLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <linearGradient id="borderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="896" height="256" rx="16" fill="url(#bgLight)" stroke="url(#borderLight)" stroke-width="1.5" />

  <!-- Ambient Glow -->
  <circle cx="120" cy="130" r="80" fill="#38bdf8" opacity="0.08" />
  <circle cx="780" cy="130" r="90" fill="#c084fc" opacity="0.06" />

  <!-- Geometric Grid Pattern Overlay -->
  <g opacity="0.03" stroke="#0f172a" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="260" />
    <line x1="200" y1="0" x2="200" y2="260" />
    <line x1="300" y1="0" x2="300" y2="260" />
    <line x1="400" y1="0" x2="400" y2="260" />
    <line x1="500" y1="0" x2="500" y2="260" />
    <line x1="600" y1="0" x2="600" y2="260" />
    <line x1="700" y1="0" x2="700" y2="260" />
    <line x1="800" y1="0" x2="800" y2="260" />
    <line x1="0" y1="65" x2="900" y2="65" />
    <line x1="0" y1="130" x2="900" y2="130" />
    <line x1="0" y1="195" x2="900" y2="195" />
  </g>

  <!-- Central Badge Icon -->
  <g transform="translate(70, 75)">
    <rect x="0" y="0" width="110" height="110" rx="22" fill="#ffffff" stroke="url(#accentLight)" stroke-width="2" />
    <!-- Octocat / Architect Compass Symbol -->
    <path d="M55 25 L80 85 L55 70 L30 85 Z" fill="url(#accentLight)" opacity="0.9" />
    <circle cx="55" cy="52" r="8" fill="#ffffff" />
    <circle cx="55" cy="52" r="4" fill="#0284c7" />
  </g>

  <!-- Typography -->
  <text x="210" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
    GitHub Repo Architect
  </text>
  
  <text x="210" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#475569">
    Autonomous Engineering &amp; Design for Top 0.1% GitHub Repositories
  </text>

  <!-- Pills / Tags -->
  <g transform="translate(210, 168)">
    <rect x="0" y="0" width="105" height="26" rx="13" fill="#e0f2fe" stroke="#0284c7" stroke-opacity="0.3" stroke-width="1" />
    <text x="52" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#0369a1">100% HEALTH</text>

    <rect x="115" y="0" width="125" height="26" rx="13" fill="#e0e7ff" stroke="#4f46e5" stroke-opacity="0.3" stroke-width="1" />
    <text x="177" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#4338ca">5-PILLAR AUDIT</text>

    <rect x="250" y="0" width="135" height="26" rx="13" fill="#f3e8ff" stroke="#9333ea" stroke-opacity="0.3" stroke-width="1" />
    <text x="317" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#7e22ce">AGENT-NATIVE DX</text>
  </g>
</svg>
