<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="2" y="2" width="896" height="256" rx="16" fill="url(#bgDark)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Glow -->
  <circle cx="120" cy="130" r="80" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="780" cy="130" r="90" fill="#c084fc" opacity="0.1" filter="url(#glow)" />

  <!-- Geometric Grid Pattern Overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="260" />
    <line x1="200" y1="0" x2="200" y2="260" />
    <line x1="300" y1="0" x2="300" y2="260" />
    <line x1="400" y1="0" x2="400" y2="260" />
    <line x1="500" y1="0" x2="500" y2="260" />
    <line x1="600" y1="0" x2="600" y2="260" />
    <line x1="700" y1="0" x2="700" y2="260" />
    <line x1="800" y1="0" x2="800" y2="260" />
    <line x1="0" y1="65" x2="900" y2="65" />
    <line x1="0" y1="130" x2="900" y2="130" />
    <line x1="0" y1="195" x2="900" y2="195" />
  </g>

  <!-- Central Badge Icon -->
  <g transform="translate(70, 75)">
    <rect x="0" y="0" width="110" height="110" rx="22" fill="#161b22" stroke="url(#accentGrad)" stroke-width="2" />
    <!-- Octocat / Architect Compass Symbol -->
    <path d="M55 25 L80 85 L55 70 L30 85 Z" fill="url(#accentGrad)" opacity="0.9" />
    <circle cx="55" cy="52" r="8" fill="#090d16" />
    <circle cx="55" cy="52" r="4" fill="#38bdf8" />
  </g>

  <!-- Typography -->
  <text x="210" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    GitHub Repo Architect
  </text>
  
  <text x="210" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#94a3b8">
    Autonomous Engineering &amp; Design for Top 0.1% GitHub Repositories
  </text>

  <!-- Pills / Tags -->
  <g transform="translate(210, 168)">
    <rect x="0" y="0" width="105" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="52" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">100% HEALTH</text>

    <rect x="115" y="0" width="125" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="177" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#818cf8">5-PILLAR AUDIT</text>

    <rect x="250" y="0" width="135" height="26" rx="13" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1" />
    <text x="317" y="17" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#c084fc">AGENT-NATIVE DX</text>
  </g>
</svg>
